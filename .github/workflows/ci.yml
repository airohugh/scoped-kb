name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    services:
      # Same image as compose.yaml. The test fixture loads schema.sql itself,
      # into its own schema, so the database only has to exist and be empty.
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scoped_kb
          POSTGRES_PASSWORD: scoped_kb_dev
          POSTGRES_DB: scoped_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoped_kb -d scoped_kb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SCOPED_KB_TEST_DATABASE_URL: postgresql://scoped_kb:scoped_kb_dev@127.0.0.1:5432/scoped_kb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "ruff==0.16.1"
      - name: Lint
        run: ruff check src tests
      # Embedding calls are stubbed in the tests; the real Ollama path is not run in CI.
      # --require-canary turns "test database missing" into a failure instead of a skip.
      - name: Test
        run: python -m pytest -q --require-canary
