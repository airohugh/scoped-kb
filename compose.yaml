# Postgres + pgvector, and Ollama. Start with: docker compose up -d
# Then pull the embedding model once: docker compose exec ollama ollama pull bge-m3
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scoped_kb
      POSTGRES_PASSWORD: scoped_kb_dev
      POSTGRES_DB: scoped_kb
    ports:
      - "127.0.0.1:${SCOPED_KB_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoped_kb -d scoped_kb"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.6
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
